name: Academy Completeness QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  inventory:
    name: Inventory executable labs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build executable Terraform inventory
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.tf' -not -path '*/.terraform/*' -printf '%h\n' | sort -u > terraform-directories.txt
          echo "Terraform configuration directories:"
          cat terraform-directories.txt
          count=$(wc -l < terraform-directories.txt)
          echo "Terraform configuration directories: $count"

      - name: Fail if no executable Terraform configuration exists
        shell: bash
        run: |
          test -s terraform-directories.txt

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: academy-completeness-inventory
          path: terraform-directories.txt
