name: Data2AI Academy Pages

on:
  push:
    branches: [main]
    paths:
      - "**/README.md"
      - "docs/**"
      - "_config.yml"
      - "_layouts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Pages deployments must not cancel an already-running deployment.
# A new push waits for the previous Pages deployment instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Generate and build learner site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate dynamic learner pages
        run: python3 docs/scripts/build-pages.py

      - name: Validate generated pages
        run: python3 docs/scripts/validate-pages.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_source
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
