name: Terraform QA

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-static:
    name: Terraform format and validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - 02-terraform-foundations/lab-02-01-first-resource
          - 03-terraform-azure/lab-03-01-project
          - 03-terraform-azure/lab-03-02-naming-tags
          - 03-terraform-azure/lab-03-03-modules
          - 03-terraform-azure/lab-03-04-remote-state
          - 03-terraform-azure/lab-03-05-environments
          - 04-foundry-foundations/lab-04-03-terraform
          - 04-foundry-foundations/lab-04-04-model-deployment
          - 06-security/lab-06-01-managed-identity
          - 06-security/lab-06-02-rbac
          - 06-security/lab-06-03-key-vault
          - 06-security/lab-06-04-private-networking
          - 07-enterprise-terraform/lab-07-01-modules
          - 07-enterprise-terraform/lab-07-02-environments
          - 07-enterprise-terraform/lab-07-03-brownfield
          - 07-enterprise-terraform/lab-07-04-drift
          - 07-enterprise-terraform/lab-07-05-testing
          - 08-devops/lab-08-01-pr-validation
          - 08-devops/lab-08-02-plan-artifact
          - 08-devops/lab-08-03-promotion
          - 09-observability-finops/lab-09-01-monitoring
          - 09-observability-finops/lab-09-02-governance
          - 09-observability-finops/lab-09-03-cost
          - 10-capstone/lab-10-01-enterprise-platform

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Check formatting
        working-directory: ${{ matrix.directory }}
        run: terraform fmt -check -recursive
      - name: Initialize without backend
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false
      - name: Validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate

  markdown-contract:
    name: Learner contract smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check learner guide
        run: test -s learner-guide.md
      - name: Check Gold Standard lab
        run: test -s 02-terraform-foundations/lab-02-01-first-resource/README.md